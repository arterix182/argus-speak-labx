<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Avatar Beta (Voz → IA → Voz)</title>

  <!-- (opcional) evita 404 en consola si subes favicon -->
  <link rel="icon" href="/assets/favicon.ico" />

  <style>
    :root{
      --bg1:#081226;
      --bg2:#030916;
      --card: rgba(255,255,255,.06);
      --card2: rgba(0,0,0,.25);
      --line: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --accent: rgba(0,210,255,.95);
      --good: rgba(0,255,170,.95);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 800px at 25% 15%, rgba(0,180,255,.14), transparent 55%),
        radial-gradient(1000px 700px at 80% 30%, rgba(0,255,170,.08), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      min-height:100vh;
      padding:22px;
    }

    .wrap{
      max-width: 1200px;
      margin: 0 auto;
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding:16px 18px;
      border-radius: 20px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      box-shadow: 0 18px 70px rgba(0,0,0,.45);
    }

    .title{
      display:flex;
      gap:12px;
      align-items:center;
    }

    .micIcon{
      width:34px; height:34px;
      border-radius: 12px;
      display:grid; place-items:center;
      background: rgba(0,210,255,.12);
      border:1px solid rgba(0,210,255,.18);
    }

    h1{
      margin:0;
      font-size: 28px;
      letter-spacing: .2px;
    }

    .sub{
      margin-top:6px;
      font-size: 13px;
      color: var(--muted);
    }

    .apiBadge{
      padding:10px 12px;
      border-radius: 999px;
      border:1px solid var(--line);
      background: rgba(0,0,0,.18);
      font-size: 12px;
      color: var(--muted);
      white-space:nowrap;
    }

    .grid{
      display:grid;
      grid-template-columns: 360px 1fr;
      gap:16px;
      align-items:start;
    }

    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
    }

    .card{
      border-radius: 22px;
      background: rgba(255,255,255,.05);
      border:1px solid var(--line);
      box-shadow: 0 18px 70px rgba(0,0,0,.42);
      overflow:hidden;
    }

    .cardPad{ padding:16px; }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-top:10px;
    }

    button, select, input{
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.20);
      color: var(--text);
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
    }
    button{
      cursor:pointer;
      transition: transform .08s ease, background .2s ease;
    }
    button:hover{ transform: translateY(-1px); background: rgba(255,255,255,.06); }
    button:active{ transform: translateY(0px); }

    .btnPrimary{
      background: rgba(0,210,255,.12);
      border-color: rgba(0,210,255,.20);
    }

    .btnDanger{
      background: rgba(255,80,80,.10);
      border-color: rgba(255,80,80,.16);
    }

    .stateLine{
      margin-top:10px;
      color: var(--muted);
      font-size: 13px;
      display:flex;
      gap:8px;
      align-items:center;
    }
    .pill{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding: 4px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      font-size: 12px;
      color: var(--muted);
    }
    .dot{
      width:8px; height:8px; border-radius:99px;
      background: rgba(255,255,255,.35);
    }
    .dot.good{ background: rgba(0,255,170,.85); }
    .dot.accent{ background: rgba(0,210,255,.85); }

    /* =========================
       AVATAR B) CSS PRO
       ========================= */
    .vx-avatarWrap{
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 22px;
      overflow: hidden;
      background: radial-gradient(120% 80% at 30% 20%, rgba(0,180,255,.18), rgba(10,18,35,.86) 60%, rgba(0,0,0,.88));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 18px 70px rgba(0,0,0,.55);
      transform: translateZ(0);
    }

    .vx-avatarImg{
      position:absolute;
      inset: 0;
      width:100%;
      height:100%;
      object-fit: cover;
      transform-origin: 50% 60%;
      filter: drop-shadow(0 14px 40px rgba(0,0,0,.55));
      animation: vxBreathe 2.8s ease-in-out infinite;
    }

    .vx-avatarGlow{
      position:absolute;
      inset:-30%;
      background: radial-gradient(circle at 40% 20%,
        rgba(0,210,255,.25),
        rgba(0,120,255,.08) 35%,
        rgba(0,0,0,0) 70%);
      filter: blur(22px);
      opacity:.9;
      animation: vxGlow 3.2s ease-in-out infinite;
      pointer-events:none;
    }

    .vx-avatarRing{
      position:absolute;
      inset: 12px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: inset 0 0 0 1px rgba(0,180,255,.06);
      pointer-events:none;
    }

    .vx-avatarLabel{
      position:absolute;
      left:12px;
      bottom:12px;
      display:flex;
      gap:10px;
      align-items:baseline;
      padding:10px 12px;
      border-radius: 14px;
      background: rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      color: rgba(255,255,255,.92);
    }
    .vx-avatarLabel b{ letter-spacing:.3px; }
    .vx-avatarLabel span{
      font-size: 12px;
      opacity: .9;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
    }

    @keyframes vxBreathe{
      0%,100%{ transform: scale(1) translateY(0px); filter: drop-shadow(0 14px 40px rgba(0,0,0,.55)); }
      50%{ transform: scale(1.02) translateY(-2px); filter: drop-shadow(0 18px 55px rgba(0,0,0,.55)); }
    }
    @keyframes vxGlow{
      0%,100%{ transform: translate(-2%, -1%) scale(1); opacity:.85; }
      50%{ transform: translate(2%, 1%) scale(1.05); opacity:1; }
    }

    /* Estados */
    .vx-avatarWrap[data-state="idle"] .vx-avatarImg{ animation-duration: 2.8s; }
    .vx-avatarWrap[data-state="listening"] .vx-avatarGlow{ opacity:1; animation-duration: 1.4s; }
    .vx-avatarWrap[data-state="listening"]{ box-shadow: 0 18px 70px rgba(0,0,0,.55), 0 0 0 2px rgba(0,210,255,.12); }
    .vx-avatarWrap[data-state="thinking"] .vx-avatarImg{ animation-duration: 2.2s; filter: drop-shadow(0 14px 40px rgba(0,0,0,.55)) saturate(1.1); }
    .vx-avatarWrap[data-state="thinking"] .vx-avatarGlow{ animation-duration: 1.0s; opacity: 1; }
    .vx-avatarWrap[data-state="speaking"] .vx-avatarImg{ animation-duration: .55s; }
    .vx-avatarWrap[data-state="speaking"]{ box-shadow: 0 18px 70px rgba(0,0,0,.55), 0 0 0 2px rgba(0,255,170,.12); }

    /* Log */
    .logBox{
      margin-top:12px;
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.20);
      padding: 12px;
      height: 360px;
      overflow:auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      color: rgba(255,255,255,.88);
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .hint{
      margin-top:10px;
      font-size: 12px;
      color: var(--muted);
    }

    .audioRow{
      display:flex;
      gap:10px;
      align-items:center;
      width:100%;
      margin-top: 10px;
    }
    .meter{
      flex:1;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.08);
      overflow:hidden;
      position:relative;
    }
    .meter > i{
      display:block;
      height:100%;
      width:0%;
      background: linear-gradient(90deg, rgba(0,210,255,.85), rgba(0,255,170,.85));
      border-radius:999px;
      transition: width .08s linear;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="title">
          <div class="micIcon">🎙️</div>
          <div>
            <h1>Avatar Beta (Voz → IA → Voz)</h1>
            <div class="sub">Toca el botón para hablar. Se detiene por silencio (~0.7s). Click de nuevo para colgar.</div>
          </div>
        </div>
      </div>
      <div class="apiBadge">API: STT | CHAT | TTS</div>
    </div>

    <div class="grid">
      <!-- LEFT -->
      <div class="card">
        <div class="cardPad">
          <!-- AVATAR -->
          <div class="vx-avatarWrap" id="vxAvatarWrap" data-state="idle">
            <div class="vx-avatarGlow"></div>
            <img id="vxAvatarImg" class="vx-avatarImg" src="/assets/avatar.png" alt="ARGUS Avatar" />
            <div class="vx-avatarRing"></div>
            <div class="vx-avatarLabel">
              <b>ARGUS Avatar</b>
              <span id="vxAvatarStateTxt">idle</span>
            </div>
          </div>

          <div class="row">
            <button id="btnCall" class="btnPrimary">📞 Iniciar llamada</button>
            <select id="mode">
              <option value="coach">Coach</option>
              <option value="grammar">Grammar</option>
              <option value="roleplay">Roleplay</option>
            </select>
            <button id="btnText" class="">💬 Probar Chat (texto)</button>
            <button id="btnClear" class="btnDanger">🧹 Limpiar</button>
          </div>

          <div class="audioRow">
            <div class="meter" title="Nivel de audio"><i id="meterFill"></i></div>
            <div class="pill"><span class="dot accent" id="dotState"></span><span id="stateTxt">idle</span></div>
          </div>

          <div class="row" style="margin-top:12px; width:100%;">
            <select id="micSelect" style="width:100%;">
              <option value="">Micrófono</option>
            </select>
            <button id="btnMics">Actualizar mics</button>
          </div>

          <div class="hint">Si estás en lugar ruidoso, habla más cerca del mic. Si no reproduce audio, revisa tu salida de audio del sistema.</div>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="card">
        <div class="cardPad">
          <div class="stateLine">
            <span class="pill"><span class="dot" id="dotCall"></span><span id="callTxt">Llamada detenida</span></span>
          </div>

          <div class="logBox" id="log"></div>

          <div class="row" style="margin-top:12px; width:100%;">
            <input id="textIn" placeholder='Ej: "I no have time yesterday"' style="flex:1; min-width:240px;" />
            <button id="btnSendText" class="btnPrimary">Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // UTIL
    // =========================================================
    const $ = (id)=>document.getElementById(id);
    const logEl = $("log");
    function addLog(line){
      const ts = new Date().toLocaleTimeString();
      logEl.textContent += `[${ts}] ${line}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // =========================================================
    // AVATAR STATES (B)
    // =========================================================
    (function(){
      const wrap = $("vxAvatarWrap");
      const txt  = $("vxAvatarStateTxt");
      function setState(s){
        if(!wrap) return;
        wrap.dataset.state = s || "idle";
        if(txt) txt.textContent = wrap.dataset.state;
        $("stateTxt").textContent = wrap.dataset.state;
        $("dotState").className = "dot " + (s==="speaking" ? "good" : "accent");
      }
      window.VX_setAvatarState = setState;
      setState("idle");
    })();

    // =========================================================
    // MIC + METER
    // =========================================================
    let audioCtx, analyser, sourceNode, mediaStream;
    let rafMeter = null;

    async function refreshMics(){
      const sel = $("micSelect");
      sel.innerHTML = `<option value="">Micrófono</option>`;
      const devices = await navigator.mediaDevices.enumerateDevices();
      const mics = devices.filter(d=>d.kind==="audioinput");
      for(const d of mics){
        const opt = document.createElement("option");
        opt.value = d.deviceId;
        opt.textContent = d.label || `Mic ${sel.length}`;
        sel.appendChild(opt);
      }
      addLog("SYS: Mics actualizados.");
    }

    async function startMeter(deviceId){
      stopMeter();
      const constraints = { audio: deviceId ? { deviceId: { exact: deviceId } } : true };
      mediaStream = await navigator.mediaDevices.getUserMedia(constraints);

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;

      sourceNode = audioCtx.createMediaStreamSource(mediaStream);
      sourceNode.connect(analyser);

      const data = new Uint8Array(analyser.fftSize);
      const fill = $("meterFill");

      function tick(){
        analyser.getByteTimeDomainData(data);
        // RMS simple
        let sum = 0;
        for(let i=0;i<data.length;i++){
          const v = (data[i]-128)/128;
          sum += v*v;
        }
        const rms = Math.sqrt(sum/data.length); // 0..1
        const pct = Math.min(100, Math.max(0, (rms*180))); // escala
        fill.style.width = pct.toFixed(1) + "%";
        rafMeter = requestAnimationFrame(tick);
      }
      tick();
    }

    function stopMeter(){
      if(rafMeter){ cancelAnimationFrame(rafMeter); rafMeter=null; }
      if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
      if(audioCtx){ audioCtx.close(); audioCtx=null; }
      $("meterFill").style.width = "0%";
    }

    // =========================================================
    // CALL LOOP (placeholder – aquí conectas tu pipeline real)
    // =========================================================
    let callActive = false;

    function setCallUI(on){
      callActive = on;
      $("btnCall").textContent = on ? "📴 Colgar" : "📞 Iniciar llamada";
      $("dotCall").className = "dot " + (on ? "good" : "");
      $("callTxt").textContent = on ? "Llamada iniciada" : "Llamada detenida";
    }

    // Simulación de estados para que veas el avatar moverse.
    // Cuando lo conectes con tu STT/CHAT/TTS real:
    // - listening al grabar
    // - thinking cuando manda a chat
    // - speaking cuando reproduce TTS
    // - idle al final
    async function demoOneTurn(text){
      window.VX_setAvatarState("listening");
      addLog("SYS: Escuchando... (silencio = stop)");
      await new Promise(r=>setTimeout(r, 500));

      window.VX_setAvatarState("thinking");
      addLog("SYS: CHAT...");
      await new Promise(r=>setTimeout(r, 600));

      addLog(`YOU: ${text}`);
      addLog(`BOT: (respuesta demo) "${text}" → corregido y explicado.`);
      addLog(`SYS: TTS...`);

      window.VX_setAvatarState("speaking");
      await new Promise(r=>setTimeout(r, 900));

      window.VX_setAvatarState("idle");
      addLog("SYS: ✅ Turno terminado.");
    }

    // =========================================================
    // EVENTS
    // =========================================================
    $("btnMics").onclick = async ()=>{
      try{ await refreshMics(); }
      catch(e){ addLog("SYS: ERROR al listar mics."); }
    };

    $("micSelect").onchange = async ()=>{
      try{
        await startMeter($("micSelect").value || null);
      }catch(e){
        addLog("SYS: ERROR al iniciar mic. Revisa permisos.");
      }
    };

    $("btnCall").onclick = async ()=>{
      if(!callActive){
        setCallUI(true);
        addLog("SYS: 📞 Llamada iniciada.");
        // empieza tu loop real aquí
        await demoOneTurn("Is this the local conversation?");
      }else{
        setCallUI(false);
        window.VX_setAvatarState("idle");
        addLog("SYS: 📴 Llamada detenida.");
      }
    };

    $("btnClear").onclick = ()=>{
      logEl.textContent = "";
      addLog("SYS: UI lista.");
    };

    $("btnText").onclick = async ()=>{
      const t = $("textIn").value.trim() || "Hello";
      await demoOneTurn(t);
    };

    $("btnSendText").onclick = async ()=>{
      const t = $("textIn").value.trim();
      if(!t){ addLog("SYS: Escribe algo."); return; }
      await demoOneTurn(t);
    };

    // Init
    (async ()=>{
      addLog("SYS: UI lista.");
      try{
        await refreshMics();
      }catch(e){
        addLog("SYS: (Aviso) No se pudieron listar mics todavía.");
      }
    })();
  </script>
</body>
</html>
