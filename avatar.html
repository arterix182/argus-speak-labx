<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Avatar Beta (Voz → IA → Voz)</title>

  <style>
    :root{
      --bg1:#081226; --bg2:#030916;
      --card: rgba(255,255,255,.05);
      --line: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; padding:22px;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 800px at 25% 15%, rgba(0,180,255,.14), transparent 55%),
        radial-gradient(1000px 700px at 80% 30%, rgba(0,255,170,.08), transparent 55%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
      min-height:100vh;
    }
    .wrap{ max-width:1200px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
    .topbar{
      display:flex; justify-content:space-between; gap:12px;
      padding:16px 18px; border-radius:20px;
      background:rgba(255,255,255,.05); border:1px solid var(--line);
      box-shadow:0 18px 70px rgba(0,0,0,.45);
    }
    h1{ margin:0; font-size:28px; letter-spacing:.2px; }
    .sub{ margin-top:6px; font-size:13px; color:var(--muted); }
    .apiBadge{
      padding:10px 12px; border-radius:999px;
      border:1px solid var(--line); background:rgba(0,0,0,.18);
      font-size:12px; color:var(--muted); white-space:nowrap;
      height: fit-content;
    }
    .grid{ display:grid; grid-template-columns:360px 1fr; gap:16px; align-items:start; }
    @media (max-width:980px){ .grid{ grid-template-columns:1fr; } }
    .card{
      border-radius:22px; background:rgba(255,255,255,.05);
      border:1px solid var(--line);
      box-shadow:0 18px 70px rgba(0,0,0,.42);
      overflow:hidden;
    }
    .pad{ padding:16px; }
    button, select, input{
      border-radius:16px; border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.20); color:var(--text);
      padding:12px 14px; font-size:14px; outline:none;
    }
    button{ cursor:pointer; transition: transform .08s ease, background .2s ease; }
    button:hover{ transform: translateY(-1px); background: rgba(255,255,255,.06); }
    .btnPrimary{ background: rgba(0,210,255,.12); border-color: rgba(0,210,255,.20); }
    .btnDanger{ background: rgba(255,80,80,.10); border-color: rgba(255,80,80,.16); }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; }

    /* AVATAR PRO */
    .vxAvatarWrap{
      position:relative; width:100%;
      aspect-ratio: 16 / 10;
      border-radius: 22px;
      overflow:hidden;
      background: radial-gradient(120% 80% at 30% 20%, rgba(0,180,255,.18), rgba(10,18,35,.86) 60%, rgba(0,0,0,.88));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 18px 70px rgba(0,0,0,.55);
    }
    video.vxAvatar{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit: cover;
      border-radius: 22px;
      /* IMPORTANTE: muted para autoplay seguro */
    }
    .badgeState{
      position:absolute; top:12px; left:12px;
      padding:6px 10px;
      border-radius:999px;
      background: rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.10);
      font-size:12px; color:rgba(255,255,255,.88);
      backdrop-filter: blur(10px);
      text-transform: lowercase;
    }

    .logBox{
      margin-top:12px;
      border-radius:18px; border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.20);
      padding:12px;
      height: 420px;
      overflow:auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size:13px;
      line-height:1.45;
      white-space: pre-wrap;
    }
    .hint{ margin-top:10px; font-size:12px; color:var(--muted); }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Avatar Beta (Voz → IA → Voz)</h1>
        <div class="sub">Toca el botón para hablar. Se detiene por silencio (~0.7s). Click de nuevo para colgar.</div>
      </div>
      <div class="apiBadge">API: STT | CHAT | TTS</div>
    </div>

    <div class="grid">
      <!-- LEFT -->
      <div class="card">
        <div class="pad">
          <!-- ✅ SOLO UN AVATAR -->
          <div class="vxAvatarWrap">
            <video id="vxAvatar" class="vxAvatar" muted playsinline loop preload="auto"></video>
            <div class="badgeState" id="vxStateBadge">idle</div>
          </div>

          <div class="row">
            <button id="btnCall" class="btnPrimary">📞 Iniciar llamada</button>
            <select id="mode">
              <option value="coach">Coach</option>
              <option value="grammar">Grammar</option>
              <option value="roleplay">Roleplay</option>
            </select>
            <button id="btnText">💬 Probar Chat (texto)</button>
            <button id="btnClear" class="btnDanger">🧹 Limpiar</button>
          </div>

          <div class="row" style="margin-top:12px; width:100%;">
            <select id="micSelect" style="width:100%;">
              <option value="">Micrófono</option>
            </select>
            <button id="btnMics">Actualizar mics</button>
          </div>

          <div class="hint">
            Si el avatar no cambia de estado: es porque tu pipeline no está llamando a <b>VX_setAvatarState()</b>.
          </div>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="card">
        <div class="pad">
          <div class="logBox" id="log"></div>

          <div class="row" style="margin-top:12px; width:100%;">
            <input id="textIn" placeholder='Ej: "I no have time yesterday"' style="flex:1; min-width:240px;" />
            <button id="btnSendText" class="btnPrimary">Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================
    // LOG
    // =========================
    const $ = (id)=>document.getElementById(id);
    const logEl = $("log");
    function addLog(line){
      const ts = new Date().toLocaleTimeString();
      logEl.textContent += `[${ts}] ${line}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // =========================
    // AVATAR STATES (4 MP4)
    // =========================
    const avatarVid = $("vxAvatar");
    const badge = $("vxStateBadge");

    const AVATAR_SRC = {
      idle:      "/assets/avatar_idle.mp4",
      listening: "/assets/avatar_listening.mp4",
      thinking:  "/assets/avatar_thinking.mp4",
      speaking:  "/assets/avatar_speaking.mp4",
    };

    let currentState = "idle";

    async function setAvatarState(state){
      const s = AVATAR_SRC[state] ? state : "idle";
      if(currentState === s) return;
      currentState = s;

      badge.textContent = s;

      // Cambia el video SOLO si hace falta
      const nextSrc = AVATAR_SRC[s];
      if(avatarVid.getAttribute("data-src") !== nextSrc){
        avatarVid.setAttribute("data-src", nextSrc);
        avatarVid.src = nextSrc;
        avatarVid.load();
      }

      // Play seguro (muted)
      try { await avatarVid.play(); } catch(e){}
    }

    // Exponer para que tu pipeline lo use:
    window.VX_setAvatarState = setAvatarState;

    // Arranque:
    setAvatarState("idle");
    addLog("SYS: UI lista.");

    // =========================
    // MIC LIST
    // =========================
    async function refreshMics(){
      const sel = $("micSelect");
      sel.innerHTML = `<option value="">Micrófono</option>`;
      const devices = await navigator.mediaDevices.enumerateDevices();
      const mics = devices.filter(d=>d.kind==="audioinput");
      for(const d of mics){
        const opt = document.createElement("option");
        opt.value = d.deviceId;
        opt.textContent = d.label || `Mic ${sel.length}`;
        sel.appendChild(opt);
      }
      addLog("SYS: Mics actualizados.");
    }

    $("btnMics").onclick = async ()=>{
      try{ await refreshMics(); }
      catch(e){ addLog("SYS: ERROR al listar mics. Permisos?"); }
    };

    // =========================
    // DEMO (para probar estados)
    // =========================
    async function demoTurn(text){
      await setAvatarState("listening");
      addLog("SYS: Escuchando...");
      await new Promise(r=>setTimeout(r, 450));

      await setAvatarState("thinking");
      addLog("SYS: CHAT...");
      await new Promise(r=>setTimeout(r, 650));

      addLog(`YOU: ${text}`);
      addLog(`BOT: (demo) respuesta para "${text}"`);
      addLog("SYS: TTS...");

      // speaking mientras "audio" suena
      await setAvatarState("speaking");
      await new Promise(r=>setTimeout(r, 1200));

      await setAvatarState("idle");
      addLog("SYS: ✅ Turno terminado.");
    }

    // =========================
    // BOTONES
    // =========================
    let callActive = false;

    $("btnCall").onclick = async ()=>{
      callActive = !callActive;
      $("btnCall").textContent = callActive ? "🟢 Grabando... (toca para colgar)" : "📞 Iniciar llamada";

      if(callActive){
        addLog("SYS: 📞 Llamada iniciada.");
        // Aquí tú conectas el pipeline real.
        // Por ahora demo:
        await demoTurn("This is the new era.");
      }else{
        addLog("SYS: 📴 Llamada detenida.");
        await setAvatarState("idle");
      }
    };

    $("btnClear").onclick = ()=>{
      logEl.textContent = "";
      addLog("SYS: UI lista.");
    };

    $("btnText").onclick = async ()=>{
      await demoTurn($("textIn").value.trim() || "Hello");
    };

    $("btnSendText").onclick = async ()=>{
      const t = $("textIn").value.trim();
      if(!t){ addLog("SYS: Escribe algo."); return; }
      await demoTurn(t);
    };

    // Init
    (async ()=>{
      try{ await refreshMics(); } catch(e){}
    })();
  </script>
</body>
</html>
