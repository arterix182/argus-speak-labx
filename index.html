<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Avatar Beta (Voz → IA → Voz)</title>
  <style>
    :root{
      --bg1:#08142b; --bg2:#0d1f3e; --card:#0b1a35cc; --txt:#eaf2ff; --mut:#a7b8d6;
      --good:#22c55e;
    }
    body{
      margin:0; font-family:system-ui,Segoe UI,Roboto,Arial;
      color:var(--txt);
      background: radial-gradient(1200px 600px at 20% 10%, #163a6b 0%, transparent 60%),
                  radial-gradient(900px 600px at 70% 20%, #1a2f5a 0%, transparent 55%),
                  linear-gradient(180deg,var(--bg1),var(--bg2));
      min-height:100vh; display:flex; justify-content:center; padding:24px;
    }
    .wrap{ width:min(1200px,100%); }
    .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .title{ display:flex; align-items:center; gap:12px; font-size:34px; font-weight:800; }
    .sub{ color:var(--mut); margin-top:6px; line-height:1.35; }
    .pill{
      background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
      padding:10px 14px; border-radius:999px; color:var(--mut); font-weight:600;
    }
    .grid{ display:grid; grid-template-columns: 420px 1fr; gap:16px; }
    .card{
      background:rgba(11,26,53,.8);
      border:1px solid rgba(255,255,255,.10);
      border-radius:22px;
      box-shadow: 0 18px 40px rgba(0,0,0,.35);
      overflow:hidden;
    }
    .cardPad{ padding:18px; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    button{
      cursor:pointer;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.08);
      color:var(--txt);
      padding:12px 14px; border-radius:16px;
      font-weight:700;
    }
    button:hover{ background:rgba(255,255,255,.12); }
    select,input{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.15);
      color:var(--txt);
      padding:12px 12px; border-radius:14px;
      outline:none;
    }
    .callBtn{ min-width:240px; display:flex; align-items:center; gap:10px; justify-content:center; }
    .dot{ width:10px;height:10px;border-radius:999px;background:var(--good); box-shadow:0 0 14px rgba(34,197,94,.6); }
    .dot.off{ background:rgba(255,255,255,.25); box-shadow:none; }
    .statusLine{ margin-top:10px; color:var(--mut); font-weight:700; }
    .log{
      background:rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.10);
      border-radius:18px;
      padding:14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space:pre-wrap;
      min-height:260px;
      max-height:520px;
      overflow:auto;
      line-height:1.35;
    }
    .meterWrap{ display:flex; align-items:center; gap:10px; width:100%; margin-top:10px; }
    .meter{ flex:1; height:10px; border-radius:999px; background:rgba(255,255,255,.10); overflow:hidden; border:1px solid rgba(255,255,255,.10); }
    .meter > div{ height:100%; width:0%; background:linear-gradient(90deg,#22c55e,#fbbf24,#ef4444); transition:width .08s linear; }
    .avatarBox{
      position:relative;
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.25);
      height:230px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .avatarImg{ max-width:100%; max-height:100%; object-fit:cover; transition: filter .2s ease; }
    .badge{
      position:absolute; left:12px; top:12px;
      padding:6px 10px; border-radius:999px;
      font-weight:800; font-size:12px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      text-transform:uppercase;
      letter-spacing:.8px;
    }
    .glow{
      position:absolute; inset:-40px;
      opacity:.0; transition:opacity .2s ease;
      background: radial-gradient(300px 200px at 30% 30%, rgba(34,197,94,.22), transparent 60%),
                  radial-gradient(280px 180px at 70% 40%, rgba(59,130,246,.20), transparent 60%),
                  radial-gradient(260px 160px at 40% 70%, rgba(251,191,36,.16), transparent 60%);
      pointer-events:none;
    }
    .mouth{
      position:absolute;
      width:90px; height:26px;
      border-radius:999px;
      bottom:34px;
      background: rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.12);
      box-shadow: 0 8px 22px rgba(0,0,0,.25);
      opacity:.0;
      transform: scaleY(0.35);
      transform-origin:center;
    }
    .idle .badge{ color:#cfe1ff; }
    .listening .glow{ opacity:.7; }
    .thinking .glow{ opacity:.7; }
    .speaking .glow{ opacity:.9; }
    .speaking .mouth{ opacity:.95; }
  </style>
</head>

<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="title">🎙️ Avatar Beta (Voz → IA → Voz)</div>
      <div class="sub">Inicia llamada, habla, auto-stop por silencio (~0.7s) y repite.</div>
    </div>
    <div class="pill">API: <b>STT</b> | <b>CHAT</b> | <b>TTS</b></div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="cardPad">
        <div id="avatarCard" class="avatarBox idle">
          <div class="glow"></div>
          <span class="badge" id="avatarState">idle</span>
          <img id="avatarImg" class="avatarImg" src="/assets/avatar.png" alt="ARGUS Avatar" />
          <div id="mouth" class="mouth"></div>
        </div>

        <div class="row" style="margin-top:12px;">
          <button id="btnCall" class="callBtn"><span id="callDot" class="dot off"></span><span id="callText">Iniciar llamada</span></button>
          <select id="selMode">
            <option value="coach">Coach</option>
            <option value="teacher">Teacher</option>
            <option value="friend">Friend</option>
          </select>
          <button id="btnTest">Probar Chat (texto)</button>
          <button id="btnClear">Limpiar</button>
        </div>

        <div class="meterWrap">
          <div class="meter"><div id="meterFill"></div></div>
          <div style="min-width:54px;color:var(--mut);font-weight:700;">Nivel</div>
        </div>

        <div class="row" style="margin-top:10px; width:100%;">
          <select id="selMic" style="width:100%;"></select>
          <button id="btnMics">Actualizar mics</button>
        </div>

        <div class="statusLine" id="statusLine">Estado: idle</div>
      </div>
    </div>

    <div class="card">
      <div class="cardPad">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <div style="font-size:20px;font-weight:900;">Log</div>
          <div class="pill" id="pillState">idle</div>
        </div>

        <div id="log" class="log" style="margin-top:10px;"></div>

        <div class="row" style="margin-top:12px;">
          <input id="txtTest" style="flex:1; min-width:260px;" placeholder='Ej: "I no have time yesterday"' />
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 🔥 IMPORTANTE: NO type="module". Y con cache-bust -->
<script src="/js/voicePipeline.js?v=300"></script>
<script src="/js/voiceRecorder.js?v=300"></script>

<script>
  const $ = (s)=>document.querySelector(s);
  const logEl = $("#log");
  const meterFill = $("#meterFill");
  const statusLine = $("#statusLine");
  const pillState = $("#pillState");
  const avatarCard = $("#avatarCard");
  const avatarState = $("#avatarState");
  const callDot = $("#callDot");
  const callText = $("#callText");
  const mouth = $("#mouth");

  function now(){ return new Date().toLocaleTimeString(); }
  function addLog(msg){
    logEl.textContent += `[${now()}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setState(state, label){
    avatarCard.classList.remove("idle","listening","thinking","speaking");
    avatarCard.classList.add(state);
    avatarState.textContent = state;
    pillState.textContent = state;
    statusLine.textContent = "Estado: " + (label || state);
  }

  window.VX_UI = {
    addLog,
    setState,
    setMeter(pct){ meterFill.style.width = Math.max(0,Math.min(100,pct)) + "%"; },
    setCallUI(on){
      callDot.classList.toggle("off", !on);
      callText.textContent = on ? "Grabando... (toca para colgar)" : "Iniciar llamada";
    },
    setMouth(power){
      const s = 0.35 + Math.min(1, Math.max(0,power)) * 1.25;
      mouth.style.transform = `scaleY(${s})`;
      mouth.style.opacity = (power>0.02) ? "0.95" : "0.0";
    }
  };

  // Sanity check duro (para que no te vuelva a marear)
  function bootCheck(){
    const ok = {
      VX_callStart: typeof window.VX_callStart,
      VX_callStop: typeof window.VX_callStop,
      VX_refreshMics: typeof window.VX_refreshMics,
      VX_transcribeAudio: typeof window.VX_transcribeAudio,
      VX_chat: typeof window.VX_chat,
      VX_ttsSpeak: typeof window.VX_ttsSpeak
    };
    addLog("SYS: UI lista.");
    addLog("SYS: BootCheck => " + JSON.stringify(ok));
    if(ok.VX_callStart !== "function"){
      addLog("SYS: ERROR: VX_callStart no cargó. Revisa /js/voiceRecorder.js (Network/404/ServiceWorker).");
    }
  }

  $("#btnClear").onclick = ()=>{ logEl.textContent=""; addLog("SYS: Limpio"); setState("idle","idle"); };
  $("#btnMics").onclick  = async ()=>{ try{ await window.VX_refreshMics(); } catch(e){ addLog("SYS: ERROR mics: " + (e?.message||e)); } };

  $("#btnTest").onclick  = async ()=>{
    const t = ($("#txtTest").value || "Hello test").trim();
    addLog("SYS: CHAT...");
    setState("thinking","Procesando...");
    try{
      const r = await window.VX_chat(t, $("#selMode").value);
      addLog("BOT: " + r);
      addLog("SYS: TTS...");
      setState("speaking","Hablando...");
      await window.VX_ttsSpeak(r);
      setState("idle","idle");
    }catch(e){
      addLog("BOT: ⚠️ " + (e?.message||e));
      setState("idle","idle");
    }
  };

  let callActive = false;
  $("#btnCall").onclick = async ()=>{
    try{
      if(!callActive){
        callActive = true;
        window.VX_UI.setCallUI(true);
        await window.VX_callStart({ selMicEl: $("#selMic"), modeEl: $("#selMode") });
      }else{
        callActive = false;
        window.VX_UI.setCallUI(false);
        await window.VX_callStop();
        setState("idle","Llamada detenida");
        addLog("SYS: 📵 Llamada detenida.");
      }
    }catch(e){
      callActive = false;
      window.VX_UI.setCallUI(false);
      addLog("SYS: ERROR: " + (e?.message||e));
      setState("idle","error");
    }
  };

  (async ()=>{
    setState("idle","idle");
    bootCheck();

    // Para que SIEMPRE salgan mics: pide permiso con gesto: usa btnMics
    // Pero intentamos listar de una:
    try{ await window.VX_refreshMics(); }catch{}
  })();
</script>
</body>
</html>
